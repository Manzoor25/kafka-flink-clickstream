apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-rt
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: clickstream
      defaultDatabase: analytics
    secureJsonData:
      password: clickstream_local
